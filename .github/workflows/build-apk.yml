# GitHub에 올리면 자동으로 APK를 만든다.
# 결과: 저장소 > Actions > 해당 실행 > Artifacts 의 「find-my-car-apk」
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 러너에는 Android SDK가 이미 설치되어 있다 (ANDROID_HOME)
      - name: Build debug APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk find-my-car.apk

      - uses: actions/upload-artifact@v4
        with:
          name: find-my-car-apk
          path: android/find-my-car.apk
