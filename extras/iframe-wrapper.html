<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>내 차 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  /* 레이아웃: 위 얇은 안내 바 + 아래 전체 화면 iframe */
  :root {
    --bar: #0f2a44;      /* 주차장 표지판 남색 */
    --bar-fg: #ffffff;
    --sign: #f5c400;     /* 주차 표지 노랑 */
    --bg: #eef2f6;
    --fg: #14202c;
    --muted: #5b6b7b;
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bar: #0a1c2e; --bg: #0d151d; --fg: #e6edf3; --muted: #9aabbb; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 상단 바 */
  .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    background: var(--bar);
    color: var(--bar-fg);
  }
  .p-mark {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 6px;
    background: var(--sign);
    color: var(--bar);
    font-weight: 700;
    font-size: 19px;
    display: grid; place-items: center;
  }
  .title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    flex: none;
    border: 0;
    background: rgba(255,255,255,.12);
    color: var(--bar-fg);
    font: 600 14px var(--font);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:active { background: rgba(255,255,255,.24); }
  .btn:focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }

  /* 본문 iframe 영역 */
  .stage { position: relative; flex: 1; min-height: 0; }
  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    background: #fff;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* 로딩 · 실패 안내 */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    background: var(--bg);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid rgba(15,42,68,.15);
    border-top-color: var(--sign);
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.6; max-width: 32ch; }
  .overlay .big { color: var(--fg); font-weight: 700; font-size: 17px; }
  .overlay .btn { background: var(--bar); padding: 12px 20px; font-size: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header class="bar">
    <div class="p-mark" aria-hidden="true">P</div>
    <div class="title">내 차 찾기</div>
    <button class="btn" id="reload" type="button">새로고침</button>
  </header>

  <main class="stage">
    <iframe id="app"
      title="내 차 찾기"
      src="https://mobile-find-my-car.vercel.app/find"
      allow="geolocation; camera; fullscreen"
      referrerpolicy="no-referrer-when-downgrade"></iframe>

    <div class="overlay" id="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>주차 위치를 불러오는 중입니다</p>
    </div>

    <div class="overlay" id="failed" hidden>
      <p class="big">화면을 불러오지 못했습니다</p>
      <p>인터넷 연결을 확인한 뒤 다시 시도하거나, 아래 버튼으로 바로 여세요.</p>
      <button class="btn" id="retry" type="button">다시 시도</button>
      <a class="btn" href="https://mobile-find-my-car.vercel.app/find" target="_top">바로 열기</a>
    </div>
  </main>

<script>
  const APP_URL = "https://mobile-find-my-car.vercel.app/find";
  const frame = document.getElementById("app");
  const loading = document.getElementById("loading");
  const failed = document.getElementById("failed");
  let timer;

  function load() {
    loading.hidden = false;
    failed.hidden = true;
    clearTimeout(timer);
    // 15초 안에 열리지 않으면 실패 안내
    timer = setTimeout(() => { loading.hidden = true; failed.hidden = false; }, 15000);
    frame.src = APP_URL + (APP_URL.includes("?") ? "&" : "?") + "_t=" + Date.now();
  }

  frame.addEventListener("load", () => {
    clearTimeout(timer);
    loading.hidden = true;
  });

  document.getElementById("reload").addEventListener("click", load);
  document.getElementById("retry").addEventListener("click", load);

  // 오프라인이 되면 안내, 다시 연결되면 자동 재시도
  window.addEventListener("offline", () => { loading.hidden = true; failed.hidden = false; });
  window.addEventListener("online", load);

  // 키오스크용: 5분 동안 터치가 없으면 첫 화면으로 되돌림
  const IDLE_MS = 5 * 60 * 1000;
  let idle;
  function resetIdle() { clearTimeout(idle); idle = setTimeout(load, IDLE_MS); }
  ["pointerdown", "keydown", "touchstart"].forEach(e => window.addEventListener(e, resetIdle, { passive: true }));
  // iframe 안 터치는 바깥에서 감지되지 않으므로 포커스 이동으로 보조 감지
  window.addEventListener("blur", resetIdle);
  resetIdle();

  timer = setTimeout(() => { loading.hidden = true; failed.hidden = false; }, 15000);
</script>
</body>
</html>
