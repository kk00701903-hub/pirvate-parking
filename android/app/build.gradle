plugins {
    id 'com.android.application'
}

android {
    namespace 'com.parking.findmycar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.parking.findmycar'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // PWA 원본(../../web)을 그대로 앱에 넣는다. 웹을 고치면 APK에도 반영된다.
    sourceSets {
        main {
            assets.srcDirs += ["$rootDir/../web"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
